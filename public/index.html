<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Game Development Toolkit</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="home-page">
    <header class="home-header">
        <p class="eyebrow">Community Game Development Toolkit</p>
        <h1>Scenes</h1>
        <p>Choose a published scene to explore it in your browser.</p>
    </header>

    <div id="scenes" class="scene-grid" aria-live="polite">
        <p class="scene-status">Loading scenes…</p>
    </div>

    <details class="sessions-panel">
        <summary>Current upload sessions</summary>
        <div id="sessions">Loading…</div>
    </details>
</main>

    <script src="script.js"></script>

</body>

</html>
