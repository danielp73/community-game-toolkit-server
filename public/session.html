<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolkit Session</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <h1>Community Game Development Toolkit</h1>

    <p>
        Session:
        <span id="session-id"></span>
    </p>

    <!-- The file input opens the phone's camera roll or camera picker. -->
    <label class="file-picker" for="image">
        Choose an image
    </label>
    <input
        type="file"
        id="image"
        name="image"
        accept="image/*">

    <!-- Hidden until an image has been selected. All editing happens here before
         the user makes the final upload. -->
    <section id="editor" class="editor" hidden>
        <div id="preview-shell" class="preview-shell">
            <!-- The checkerboard makes a removed (transparent) background easy
                 to see on any phone. -->
            <img id="preview" alt="Selected image preview">

            <!-- This canvas replaces the static preview while crop mode is
                 active. It draws the photo, freeform crop frame, and handles. -->
            <canvas
                id="crop-canvas"
                class="crop-canvas"
                aria-label="Crop image. Drag the photo, pinch to zoom, or drag a corner handle."
                hidden></canvas>

            <!-- Shown over the image only while the server removes its
                 background, so users know the request is still active. -->
            <div id="removal-loading" class="removal-loading" role="status" hidden>
                <span class="loading-spinner" aria-hidden="true"></span>
                <span>Removing background…</span>
            </div>
        </div>

        <div class="editor-actions">
            <button type="button" id="crop-button">Crop image</button>
            <button type="button" id="remove-background-button">Remove background</button>
            <button type="button" id="reset-button" class="secondary">Reset edits</button>
        </div>

        <!-- These controls appear only while the interactive crop canvas is
             open. Applying the crop creates a new local preview; nothing has
             been uploaded to the server at this point. -->
        <div id="crop-actions" class="crop-actions" hidden>
            <button type="button" id="apply-crop-button">Apply crop</button>
            <button type="button" id="cancel-crop-button" class="secondary">Cancel</button>
        </div>

        <!-- This is deliberately separate from Remove background: the user
             decides exactly when the edited image should be saved to a session. -->
        <button type="button" id="upload-button" class="upload-button">Upload image</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <script src="/session.js"></script>

</body>

</html>
