<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolkit Session</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <h1>Community Game Development Toolkit</h1>

    <p>
        Session:
        <span id="session-id"></span>
    </p>

    <form id="upload-form">

        <input
            type="file"
            id="image"
            name="image"
            accept="image/*">

        <button type="submit">
            Upload
        </button>

    </form>

    <p id="status"></p>

    <script src="/session.js"></script>

</body>

</html>
