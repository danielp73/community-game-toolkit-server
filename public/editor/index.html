<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Toolkit - Viewer</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      outline: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
      color: #fff;
      font: 15px/1.5 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
    }

    #overlay[hidden], #controls[hidden], #error-details[hidden] {
      display: none;
    }

    .overlay-content {
      width: min(360px, 88vw);
      padding: 10px 16px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
    }

    #scene-title {
      margin: 0 0 8px;
      font-size: 0.95rem;
    }

    #loading-track {
      height: 2px;
      margin: 18px 0 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.2);
    }

    #loading-progress {
      width: 0;
      height: 100%;
      background: #fff;
    }

    #status, #image-progress, #error-details {
      margin: 7px 0 0;
      color: rgba(255, 255, 255, 0.72);
    }

    #error-actions {
      display: none;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    #overlay.is-error #loading-track, #overlay.is-error #image-progress {
      display: none;
    }

    #overlay.is-error #error-actions {
      display: flex;
    }

    #overlay.is-error {
      align-items: center;
      background: rgba(0, 0, 0, 0.78);
      pointer-events: auto;
    }

    #overlay.is-error .overlay-content {
      padding: 24px;
    }

    #error-actions button, #error-actions a {
      padding: 9px 14px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      background: transparent;
      color: #fff;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    #controls {
      position: fixed;
      left: 50%;
      bottom: 24px;
      padding: 9px 14px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.68);
      color: #fff;
      font: 13px/1.4 system-ui, sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }

    #unity-warning {
      position: fixed;
      z-index: 1;
      top: 0;
      left: 50%;
      max-width: min(720px, 90vw);
      transform: translateX(-50%);
      font: 14px/1.4 sans-serif;
    }

    #add-image {
      position: fixed;
      z-index: 2;
      top: 16px;
      right: 16px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font: 600 14px/1.2 system-ui, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #add-image:disabled {
      cursor: wait;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <button type="button" id="add-image">Add image</button>
  <div id="overlay">
    <div class="overlay-content">
      <h1 id="scene-title">Community Game Development Toolkit</h1>
      <p id="status">Loading viewer…</p>
      <div id="loading-track"><div id="loading-progress"></div></div>
      <p id="image-progress"></p>
      <p id="error-details" hidden></p>
      <div id="error-actions">
        <button type="button" id="retry">Try again</button>
        <a href="/">Back to scenes</a>
      </div>
    </div>
  </div>
  <div id="controls" hidden>Click to begin · WASD to move · Mouse to look</div>
  <div id="unity-warning"></div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const overlay = document.querySelector("#overlay");
    const loadingProgress = document.querySelector("#loading-progress");
    const sceneTitle = document.querySelector("#scene-title");
    const status = document.querySelector("#status");
    const imageProgress = document.querySelector("#image-progress");
    const errorDetails = document.querySelector("#error-details");
    const controls = document.querySelector("#controls");
    const warningBanner = document.querySelector("#unity-warning");
    const addImageButton = document.querySelector("#add-image");
    let unityInstance = null;
    let uploadTab = null;
    let activeSessionId = null;
    let sessionPollTimer = null;
    const importedUploads = new Set();

    document.querySelector("#retry").onclick = () => location.reload();

    addImageButton.onclick = async () => {
      // Open the tab during the click itself. Browsers may block window.open if
      // it happens after the asynchronous session request has completed.
      uploadTab = window.open("", "toolkit-image-upload");

      if (!uploadTab) {
        showBanner("Allow pop-ups to open the image uploader.", "error");
        return;
      }

      uploadTab.document.title = "Preparing image upload…";
      uploadTab.document.body.textContent = "Preparing image upload…";
      addImageButton.disabled = true;

      try {
        const response = await fetch("/create-session", { method: "POST" });
        if (!response.ok) {
          throw new Error(`Session request failed (${response.status}).`);
        }

        const session = await response.json();
        if (!session.sessionId) {
          throw new Error("The server did not return a session ID.");
        }

        activeSessionId = session.sessionId;
        startSessionPolling(activeSessionId);
        uploadTab.location.replace(`/session/${encodeURIComponent(session.sessionId)}`);
      } catch (error) {
        uploadTab.close();
        showBanner("The image upload session could not be started.", "error");
        console.error(error);
      } finally {
        addImageButton.disabled = false;
        canvas.focus();
      }
    };

    window.addEventListener("message", event => {
      if (event.origin !== window.location.origin ||
          event.data?.type !== "toolkit-upload-complete") {
        return;
      }

      const { sessionId, filename } = event.data;
      if (sessionId !== activeSessionId || !filename) {
        return;
      }

      // This message is only a fast path. Polling the session remains the
      // source of truth if the browser drops the relationship between tabs.
      importSessionUpload(sessionId, filename);
      uploadTab = null;
    });

    function startSessionPolling(sessionId) {
      if (sessionPollTimer) {
        clearTimeout(sessionPollTimer);
      }

      pollSessionUploads(sessionId);
    }

    async function pollSessionUploads(sessionId) {
      if (sessionId !== activeSessionId) {
        return;
      }

      try {
        const response = await fetch(
          `/api/session/${encodeURIComponent(sessionId)}/uploads`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(`Upload-list request failed (${response.status}).`);
        }

        const result = await response.json();
        // The server historically returned [] before the first upload and
        // { media: [...] } after one existed, so accept both response shapes.
        const filenames = Array.isArray(result) ? result : result.media || [];

        for (const filename of filenames) {
          importSessionUpload(sessionId, filename);
        }
      } catch (error) {
        // A temporary network failure should not end the upload session. The
        // next poll retries automatically.
        console.warn("Could not check the upload session.", error);
      } finally {
        if (sessionId === activeSessionId) {
          sessionPollTimer = setTimeout(() => pollSessionUploads(sessionId), 1000);
        }
      }
    }

    function importSessionUpload(sessionId, filename) {
      if (sessionId !== activeSessionId || !filename || !unityInstance) {
        return false;
      }

      const uploadKey = `${sessionId}/${filename}`;
      if (importedUploads.has(uploadKey)) {
        return true;
      }

      const message = JSON.stringify({
        filename,
        imageUrl: new URL(
          `/uploads/${encodeURIComponent(sessionId)}/${encodeURIComponent(filename)}`,
          window.location.origin
        ).href
      });

      unityInstance.SendMessage("ToolkitWebEditor", "AddUploadedImage", message);
      importedUploads.add(uploadKey);
      showBanner("Image uploaded. Adding it to the scene…", "warning");
      return true;
    }

    window.toolkitViewerSetStatus = (message, current, total) => {
      overlay.hidden = false;
      overlay.classList.remove("is-error");
      status.textContent = message;
      imageProgress.textContent = total > 0 ? `${current} of ${total}` : "";
      loadingProgress.style.width = total > 0 ? `${current / total * 100}%` : "100%";
    };

    window.toolkitViewerSetTitle = title => {
      sceneTitle.textContent = title;
      document.title = title;
    };

    window.toolkitViewerShowReady = failedImageCount => {
      overlay.hidden = true;
      if (failedImageCount > 0) {
        showBanner(`${failedImageCount} image${failedImageCount === 1 ? "" : "s"} could not be loaded.`, "warning");
      }
      controls.hidden = false;
      setTimeout(() => controls.hidden = true, 7000);
      canvas.focus();
    };

    window.toolkitViewerShowError = (message, details) => {
      overlay.hidden = false;
      overlay.classList.add("is-error");
      sceneTitle.textContent = "Unable to load scene";
      status.textContent = message;
      errorDetails.textContent = details;
      errorDetails.hidden = !details;
    };

    function showBanner(message, type) {
      const notice = document.createElement("div");
      notice.textContent = message;
      notice.style.padding = "10px";
      notice.style.background = type === "error" ? "#b00020" : "#e6b800";
      notice.style.color = type === "error" ? "#fff" : "#111";
      warningBanner.appendChild(notice);

      if (type !== "error") {
        setTimeout(() => notice.remove(), 5000);
      }
    }

    const buildUrl = "Build";
    const config = {
      arguments: [],
      dataUrl: buildUrl + "/EditorWebGL.data",
      frameworkUrl: buildUrl + "/EditorWebGL.framework.js",
      codeUrl: buildUrl + "/EditorWebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Toolkit - Viewer",
      productVersion: "0.1.0",
      showBanner: showBanner
    };

    const loaderScript = document.createElement("script");
    loaderScript.src = buildUrl + "/EditorWebGL.loader.js";
    loaderScript.onload = () => {
      createUnityInstance(canvas, config, progress => {
        loadingProgress.style.width = (progress * 100) + "%";
      }).then(instance => {
        unityInstance = instance;
        if (!overlay.classList.contains("is-error")) {
          status.textContent = "Loading scene…";
          loadingProgress.style.width = "100%";
        }
        canvas.focus();
      }).catch(message => {
        window.toolkitViewerShowError("The viewer could not start.", String(message));
      });
    };
    document.body.appendChild(loaderScript);
  </script>
</body>
</html>
